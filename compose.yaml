# Runs the self-contained image built by `make build` on the server.
# One container serves the static site (public/) and the live /mcp endpoint.
# It listens on plain HTTP; the host's existing Caddy terminates TLS and
# reverse-proxies to host.docker.internal:APP_LOCAL_PORT (see DEPLOY.md).
#
# The server must hold a .env.local providing at least APP_SECRET.
services:
  app:
    image: ${IMAGE:-homepage:latest}
    restart: unless-stopped
    env_file:
      - .env.local            # APP_SECRET (and any runtime overrides)
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
    ports:
      # Plain HTTP on all interfaces (needed for host.docker.internal access).
      # Configure via APP_LOCAL_PORT env var (default: 8080).
      - "${APP_LOCAL_PORT:-8080}:80"
