# config/packages/mcp.yaml
mcp:
    servers:
        default:
            name: 'profile-mcp'
            transports:
                stdio: true
                http: true
            http:
                path: /mcp
                # DNS rebinding protection: allow our hosts (SDK default is localhost only).
                allowed_hosts: ['localhost', '127.0.0.1', 'host.docker.internal', 'jeremielibeau.fr']
            registry: '*'         # expose every registered capability
