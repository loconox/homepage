# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Behind the host's Caddy reverse proxy: trust its forwarded headers so
    # Symfony sees the real scheme (https) and host.
    trusted_proxies: 'private_ranges'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-host', 'x-forwarded-proto', 'x-forwarded-port']

    # Allow requests from localhost, 127.0.0.1, and docker host
    trusted_hosts: ['^localhost$', '^127\.0\.0\.1$', '^127\.0\.0\.1:\d+$', '^host\.docker\.internal$', '^jeremielibeau\.fr$']

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
